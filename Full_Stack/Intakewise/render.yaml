services:
  - type: web
    name: intakewise-api
    runtime: node
    plan: free
    rootDir: Full_Stack/Intakewise/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render has no outbound IPv6, so the IPv6-only direct host (db.<ref>.supabase.co) is unreachable.
      # Use the free Supabase session pooler (IPv4), entered in the Render dashboard on first Blueprint sync:
      # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Upload Supabase's prod-ca-2021.crt (Database Settings > SSL Configuration) as a Render
      # Secret File named prod-ca-2021.crt; Render mounts secret files under /etc/secrets/.
      - key: DATABASE_SSL_CA_FILE
        value: /etc/secrets/prod-ca-2021.crt
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          name: intakewise
          type: web
          property: host
      - key: PASSWORD_RESET_URL_BASE
        value: https://intakewise.onrender.com
      - key: PASSWORD_RESET_EXPOSE_LINK
        value: "false"
      # Brevo's HTTPS API works on Render's free plan; SMTP ports are blocked there.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      # Optional local/paid-host SMTP fallback.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_DELIVERY_TIMEOUT_MS
        value: "15000"
      - key: PUBLIC_DATA_CONTACT_EMAIL
        sync: false
      - key: OPENFDA_API_KEY
        sync: false
      - key: DAILYMED_API_BASE_URL
        value: https://dailymed.nlm.nih.gov/dailymed/services/v2
      - key: DAILYMED_WEB_BASE_URL
        value: https://dailymed.nlm.nih.gov/dailymed
      - key: RXNORM_API_BASE_URL
        value: https://rxnav.nlm.nih.gov/REST
      - key: OPENFDA_API_URL
        value: https://api.fda.gov/drug/label.json
      - key: FDA_SRS_API_URL
        value: https://precision.fda.gov/srs/api/v1/substances
      - key: NCBI_EUTILS_BASE_URL
        value: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
      - key: PUBMED_WEB_BASE_URL
        value: https://pubmed.ncbi.nlm.nih.gov
      - key: MEDLINEPLUS_CONNECT_URL
        value: https://connect.medlineplus.gov/service
      - key: NIH_ODS_DSLD_API_BASE_URL
        value: https://api.ods.od.nih.gov/dsld/v9
      - key: NIH_ODS_SUPPLEMENT_API_URL
        value: https://ods.od.nih.gov/api/supplement.json
      - key: PUBLIC_DATA_REQUEST_TIMEOUT_MS
        value: "8000"
      - key: PUBLIC_DATA_TOOL_NAME
        value: intakewise

  - type: web
    name: intakewise
    runtime: static
    rootDir: Full_Stack/Intakewise/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://intakewise-api.onrender.com/api
      - key: VITE_API_TIMEOUT_MS
        value: "30000"
